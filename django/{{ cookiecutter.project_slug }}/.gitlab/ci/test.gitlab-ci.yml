django-test:
  stage: test
  interruptible: true
  image: orbisk/django-test:{{ cookiecutter.python_version }}
  extends:
    - .size:medium
  services:
    - postgres:{{ cookiecutter.postgresql_version }}
  variables:
    DJANGO_SETTINGS_MODULE: "{{ cookiecutter.project_slug }}.settings.test"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
  script:
    - uv run coverage run manage.py test --no-input --keepdb --timing --buffer
    - uv run coverage combine
    - uv run coverage report
    - uv run coverage xml
    - uv run coverage html
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?)\%$/'
  after_script:
    - uv cache prune --ci
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy-check:
  stage: test
  interruptible: true
  allow_failure: true
  image: orbisk/django-test:{{ cookiecutter.python_version }}
  extends:
    - .size:medium
  variables:
    DJANGO_SETTINGS_MODULE: "{{ cookiecutter.project_slug }}.settings.staging"
    DJANGO_SECRET_KEY: "not-very-secret-but-it's-fine-for-this-very-cool-deploy-check"
  script:
    - uv run manage.py check --deploy --fail-level DEBUG --force-color
  rules:
    - if: $CI_COMMIT_REF_PROTECTED
      allow_failure:  false
